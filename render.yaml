# Render Blueprint for the demo API + database (free plans).
# Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: roombooking-demo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Bangkok
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "true"
      - key: FRONTEND_URL
        value: https://pongpak-tephee.github.io/roombooking-demo
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roombooking-demo-db
          property: connectionString

databases:
  - name: roombooking-demo-db
    plan: free
    databaseName: roombooking_demo
